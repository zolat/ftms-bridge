[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.5
build_flags =
    -D CONFIG_BT_NIMBLE_ROLE_CENTRAL=1
    -D CONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -D CONFIG_BT_NIMBLE_ROLE_OBSERVER=1
    -D CONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -D CONFIG_BT_NIMBLE_MAX_BONDS=8
    -D DEBUG_LOG=1

; Same firmware with NimBLE's own GAP/GATT tracing turned on. Flash this when a watch
; finds the bridge but won't connect -- the trace shows how far it got.
[env:esp32dev-debug]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D CONFIG_NIMBLE_CPP_LOG_LEVEL=4
    -D CORE_DEBUG_LEVEL=4

[env:native]
platform = native
build_flags = -std=c++17
test_build_src = false
